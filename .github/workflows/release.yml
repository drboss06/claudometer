name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version from tag
        id: version
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v', ''
          if ([string]::IsNullOrWhiteSpace($v) -or $v -eq "${{ github.ref_name }}") { $v = "0.0.0" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish self-contained single-file app
        shell: pwsh
        run: >-
          dotnet publish src/ClaudeUsageTray/ClaudeUsageTray.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.version }}
          --output publish/${{ matrix.rid }}

      - name: Package with checksum
        shell: pwsh
        run: |
          $zip = "ClaudeUsageTray-${{ matrix.rid }}.zip"
          Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          "$hash  $zip" | Out-File -FilePath "$zip.sha256" -Encoding ascii

      - name: Create or update GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          # Create the release once; matrix jobs race, so ignore "already exists".
          gh release create $tag --generate-notes --title "Claude Usage Tray $tag" 2>$null
          gh release upload $tag "ClaudeUsageTray-${{ matrix.rid }}.zip" "ClaudeUsageTray-${{ matrix.rid }}.zip.sha256" --clobber
