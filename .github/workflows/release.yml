name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained app
        run: >-
          dotnet publish src/ClaudeUsageTray/ClaudeUsageTray.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish/win-x64

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath ClaudeUsageTray-win-x64.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsageTray-win-x64
          path: ClaudeUsageTray-win-x64.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" ClaudeUsageTray-win-x64.zip --generate-notes --title "Claude Usage Tray ${{ github.ref_name }}"
