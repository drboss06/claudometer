name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build ClaudeUsageTray.sln --configuration Release

      - name: Offline parser checks
        run: dotnet src/ClaudeUsageTray/bin/Release/net8.0-windows/win-x64/ClaudeUsageTray.dll --self-test
