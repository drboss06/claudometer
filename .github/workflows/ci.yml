name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build ClaudeUsageTray.sln --configuration Release

      - name: Test
        run: dotnet test ClaudeUsageTray.sln --configuration Release --no-build

      - name: Offline parser checks
        run: dotnet run --project src/ClaudeUsageTray/ClaudeUsageTray.csproj --configuration Release --no-build -- --self-test

      - name: Publish smoke test (single-file, self-contained)
        run: >-
          dotnet publish src/ClaudeUsageTray/ClaudeUsageTray.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          --output publish/ci
