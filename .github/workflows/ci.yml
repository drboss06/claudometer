name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build ClaudeUsageTray.sln --configuration Release

      - name: Test
        run: dotnet test ClaudeUsageTray.sln --configuration Release --no-build

      - name: Offline parser checks
        run: dotnet run --project src/ClaudeUsageTray/ClaudeUsageTray.csproj --configuration Release --no-build -- --self-test

      - name: Publish smoke test (single-file, self-contained)
        run: >-
          dotnet publish src/ClaudeUsageTray/ClaudeUsageTray.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          --output publish/ci
